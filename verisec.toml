[review]
max_evidence_lines = 12
source_context_lines = 8
min_confidence = 0.35

# Rule packs loaded through the RuleProvider registry.
# "builtin" includes the full default rule set (AST + regex).
# "django" is an optional specialized pack (also covered by builtin today).
[rules]
packs = ["builtin"]

# Optional TOML adapter plugins (merged with built-in adapters).
# Examples:
# paths = ["adapters/bandit.toml", "adapters/pip-audit.toml"]
[adapters]
paths = []

[policy]
enabled = true
execution_profile = "trusted-local"
allowed_adapters = [
  "pytest",
  "ruff",
  "semgrep",
  "codeql",
  "poc-script",
  "custom",
  "bandit",
  "pip-audit",
]
allowed_executables = [
  "{python}",
  "pytest",
  "ruff",
  "semgrep",
  "codeql",
  "bandit",
  "pip-audit",
]
max_timeout_seconds = 600
max_output_bytes = 1000000
block_unavailable_adapters = false
warn_unavailable_adapters = true
environment_mode = "minimal"
network_access = "inherit"

[[verification.adapters]]
id = "pytest"
timeout_seconds = 60
required = false

[[verification.adapters]]
id = "ruff"
timeout_seconds = 60
required = false

# Property checks that back VeriSec's review of its own pull requests with
# executed evidence. Emits VERISEC_EVIDENCE markers only for checks it verifies;
# see scripts/self_review_evidence.py for what is deliberately left uncovered.
[[verification.commands]]
name = "self-review-evidence"
argv = ["{python}", "scripts/self_review_evidence.py"]
timeout_seconds = 60
required = false
adapter = "custom"
description = "Emit VERISEC_EVIDENCE markers for VeriSec's own detector properties."
capabilities = ["unit-test", "property-check", "python-test"]

# Optional external scanners (uncomment paths + blocks after install):
#   pip install bandit pip-audit
# [[verification.adapters]]
# id = "bandit"
# required = false
# [[verification.adapters]]
# id = "pip-audit"
# required = false
