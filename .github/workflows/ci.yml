name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      verisec-comment-ready: ${{ steps.verisec_comment.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m pytest

      - name: Run release portfolio
        if: github.event_name != 'pull_request'
        run: >
          python -m verisec_agent portfolio
          --manifest verisec_portfolio.json
          --out verisec-runs/release-portfolio
          --policy-profile trusted-ci
          --github-step-summary
      - name: Attest release portfolio artifacts
        if: github.event_name != 'pull_request'
        run: >
          python -m verisec_agent attest
          --index verisec-runs/release-portfolio/artifact_index.json
          --out verisec-runs/release-portfolio-attestation
          --github-step-summary

      - name: Review pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python -m verisec_agent review
          --pr ${{ github.event.pull_request.number }}
          --github-repo ${{ github.repository }}
          --repo .
          --out verisec-runs/pr-review
          --config verisec.toml
          --policy-profile trusted-ci
      - id: verisec_gate
        name: Gate pull request review
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: >
          python -m verisec_agent gate
          --report verisec-runs/pr-review/report.json
          --out verisec-runs/pr-gate
          --min-validation-coverage 0.5
          --min-avg-confidence 0.6
          --max-policy-blocked 0
          --max-high 10
          --max-validation-gap-rate 1.0
          --github-step-summary
      - name: Render pull request comment
        if: github.event_name == 'pull_request'
        run: >
          python -m verisec_agent pr-comment
          --report verisec-runs/pr-review/report.json
          --gate verisec-runs/pr-gate/gate.json
          --out verisec-runs/pr-comment.md
      - id: verisec_comment
        if: github.event_name == 'pull_request'
        run: echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: verisec-pr-comment
          path: verisec-runs/pr-comment.md
          if-no-files-found: error
      - if: github.event_name == 'pull_request' && steps.verisec_gate.outcome == 'failure'
        run: exit 1

  fork-review:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install trusted base tooling
        run: python -m pip install -e ".[dev]"
      - name: Review fork pull request as an untrusted diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python -m verisec_agent review
          --pr ${{ github.event.pull_request.number }}
          --github-repo ${{ github.repository }}
          --repo .
          --out verisec-runs/pr-review
          --config verisec.toml
          --policy-profile untrusted-fork-pr
      - id: verisec_gate
        name: Gate fork pull request review
        continue-on-error: true
        run: >
          python -m verisec_agent gate
          --report verisec-runs/pr-review/report.json
          --out verisec-runs/pr-gate
          --min-validation-coverage 0.5
          --min-avg-confidence 0.6
          --max-policy-blocked 0
          --max-high 10
          --max-validation-gap-rate 1.0
          --github-step-summary
      - name: Render fork pull request artifact
        run: >
          python -m verisec_agent pr-comment
          --report verisec-runs/pr-review/report.json
          --gate verisec-runs/pr-gate/gate.json
          --out verisec-runs/pr-comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: verisec-pr-comment
          path: verisec-runs/pr-comment.md
          if-no-files-found: error
      - if: steps.verisec_gate.outcome == 'failure'
        run: exit 1

  comment:
    if: >
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.test.outputs.verisec-comment-ready == 'true'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # PR conversation comments are served by the issues API but the resource is
      # a pull request, so pull-requests: write is what authorizes them.
      # issues: write alone returns 403 on /issues/{n}/comments for a PR.
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verisec-pr-comment
          path: verisec-comment
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- verisec-agent:pr-comment -->";
            const body = fs.readFileSync("verisec-comment/pr-comment.md", "utf8");
            if (!body.includes(marker)) {
              core.setFailed(`VeriSec comment body is missing marker: ${marker}`);
              return;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
