[review]
max_evidence_lines = 18
source_context_lines = 10
min_confidence = 0.35

[policy]
enabled = true
execution_profile = "trusted-local"
allowed_adapters = ["custom"]
allowed_executables = ["{python}"]
max_timeout_seconds = 120
max_output_bytes = 1000000
block_unavailable_adapters = false
warn_unavailable_adapters = true
environment_mode = "minimal"
network_access = "inherit"

[[verification.commands]]
name = "django-username-normalization-dos-property"
argv = [
  "{python}",
  "-c",
  '''
import json
from pathlib import Path

forms = Path("django/contrib/auth/forms.py").read_text(encoding="utf-8")
tests = Path("tests/auth_tests/test_forms.py").read_text(encoding="utf-8")
assignment = "value = super().to_python(value)"
guard = "if self.max_length is not None and len(value) > self.max_length:"
early_return = "return value"
normalize = 'return unicodedata.normalize("NFKC", value)'
assert assignment in forms
assert guard in forms
assert forms.index(assignment) < forms.index(guard) < forms.index(normalize)
assert early_return in forms[forms.index(guard):forms.index(normalize)]
assert "def test_invalid_username_no_normalize(self):" in tests
assert 'field.to_python("½" * 255)' in tests
print(
    "VERISEC_EVIDENCE: "
    + json.dumps(
        dict(
            kind="property-check",
            rule_id="py-unicode-normalization-dos",
            file_path="django/contrib/auth/forms.py",
            check="Unicode normalization complexity regression test",
            assertion="Overlong invalid usernames return before expensive NFKC normalization.",
        ),
        sort_keys=True,
    )
)
''',
]
timeout_seconds = 30
required = true
adapter = "custom"
description = "Check that overlong usernames bypass expensive NFKC normalization."
capabilities = ["regression-test", "property-check", "algorithmic-complexity"]
