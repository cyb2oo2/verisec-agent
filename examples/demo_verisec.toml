[review]
max_evidence_lines = 12
source_context_lines = 8
min_confidence = 0.35

[policy]
enabled = true
execution_profile = "trusted-local"
allowed_adapters = ["pytest", "ruff", "custom"]
allowed_executables = ["{python}", "pytest", "ruff"]
max_timeout_seconds = 120
max_output_bytes = 1000000
block_unavailable_adapters = false
warn_unavailable_adapters = true
environment_mode = "minimal"
network_access = "inherit"

[[verification.adapters]]
id = "pytest"
timeout_seconds = 60
required = false

[[verification.adapters]]
id = "ruff"
timeout_seconds = 60
required = false

[[verification.commands]]
name = "demo-shell-validation-evidence"
command = "{python} examples/demo_validation.py"
argv = ["{python}", "examples/demo_validation.py"]
timeout_seconds = 30
required = true
adapter = "custom"
description = "Emit static and shell-metacharacter evidence for the demo finding."
capabilities = ["unit-test", "static-analysis", "command-injection"]
