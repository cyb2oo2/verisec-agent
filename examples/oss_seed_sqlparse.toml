[review]
max_evidence_lines = 16
source_context_lines = 10
min_confidence = 0.35

[policy]
enabled = true
execution_profile = "trusted-local"
allowed_adapters = ["custom"]
allowed_executables = ["{python}"]
max_timeout_seconds = 120
max_output_bytes = 1000000
block_unavailable_adapters = false
warn_unavailable_adapters = true
environment_mode = "minimal"
network_access = "inherit"

[[verification.commands]]
name = "sqlparse-redos-regex-property"
command = '''{python} -c "import json; from pathlib import Path; text=Path('sqlparse/filters/others.py').read_text(); b=chr(92); assert '(('+b+'r|'+b+'n)+) *$' in text and '(('+b+'r'+b+'n|'+b+'r|'+b+'n)+) *$' not in text; print('VERISEC_EVIDENCE: ' + json.dumps(dict(kind='property-check', rule_id='py-regex-redos-hardening', file_path='sqlparse/filters/others.py', check='ReDoS regression test with adversarial input', assertion='ambiguous CRLF alternation is removed from the line-break regex'), sort_keys=True))"'''
timeout_seconds = 30
required = true
adapter = "custom"
description = "Check that sqlparse uses the hardened line-break regex for stripping comments."
capabilities = ["regression-test", "property-check", "redos-regression"]
