# Holdout 2 property check — holdout2-vllm-mrope-prompt-embeds
# Verifies the upstream patch does what its advisory claims, independent of any
# detector result. Emits VERISEC_NOTE. NOT frozen; see docs/HOLDOUT_2.md.

[review]
max_evidence_lines = 18
source_context_lines = 10
min_confidence = 0.35

[policy]
enabled = true
execution_profile = "trusted-local"
allowed_adapters = ["custom"]
allowed_executables = ["{python}"]
max_timeout_seconds = 120
max_output_bytes = 1000000
block_unavailable_adapters = false
warn_unavailable_adapters = true
environment_mode = "minimal"
network_access = "inherit"

[[verification.commands]]
name = "holdout2-vllm-mrope-prompt-embeds-property"
argv = [
  "{python}",
  "-c",
  """
import json
from pathlib import Path

target = Path('vllm/v1/worker/gpu_model_runner.py')
text = target.read_text(encoding="utf-8")
present = ['elif req_state.prompt_embeds is not None:', 'input_tokens = list(range(seq_len))']
absent = []
for token in present:
    assert token in text, "expected patched content missing: " + token
for token in absent:
    assert token not in text, "pre-image construct still present: " + token
marker = 'NOTE'
payload = dict(
    kind="property-check",
    file_path='vllm/v1/worker/gpu_model_runner.py',
    check='prompt-embeds crash regression test',
    assertion='M-RoPE path handles embeddings-only input instead of asserting prompt_token_ids. No VeriSec rule covers this assertion-DoS class.',
)
pass
print("VERISEC_" + marker + ": " + json.dumps(payload, sort_keys=True))
""",
]
timeout_seconds = 30
required = true
adapter = "custom"
description = "Property check for holdout2-vllm-mrope-prompt-embeds: assert the patch content, independent of detector output."
capabilities = ["property-check", "denial-of-service"]
