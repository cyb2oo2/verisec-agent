[review]
max_evidence_lines = 18
source_context_lines = 10
min_confidence = 0.35

[policy]
enabled = true
execution_profile = "trusted-local"
allowed_adapters = ["custom"]
allowed_executables = ["{python}"]
max_timeout_seconds = 120
max_output_bytes = 1000000
block_unavailable_adapters = false
warn_unavailable_adapters = true
environment_mode = "minimal"
network_access = "inherit"

[[verification.commands]]
name = "django-validator-redos-bounds-property"
argv = [
  "{python}",
  "-c",
  '''
import json
from pathlib import Path

validators = Path("django/core/validators.py").read_text(encoding="utf-8")
fields = Path("django/forms/fields.py").read_text(encoding="utf-8")
assert "max_length = 2048" in validators
assert "len(value) > self.max_length" in validators
assert 'len(value) > 320' in validators
assert 'kwargs.setdefault("max_length", 320)' in fields
print(
    "VERISEC_EVIDENCE: "
    + json.dumps(
        dict(
            kind="property-check",
            rule_id="py-regex-redos-hardening",
            file_path="django/core/validators.py",
            check="ReDoS regression test with adversarial input",
            assertion="URL and email validators reject overlong attacker-controlled values before regex-heavy validation.",
        ),
        sort_keys=True,
    )
)
''',
]
timeout_seconds = 30
required = true
adapter = "custom"
description = "Check that Django bounds URL and email validator inputs before regex-heavy validation."
capabilities = ["regression-test", "property-check", "redos-regression"]
