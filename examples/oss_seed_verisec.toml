[review]
max_evidence_lines = 16
source_context_lines = 10
min_confidence = 0.35

[policy]
enabled = true
execution_profile = "trusted-local"
allowed_adapters = ["custom"]
allowed_executables = ["{python}"]
max_timeout_seconds = 120
max_output_bytes = 1000000
block_unavailable_adapters = false
warn_unavailable_adapters = true
environment_mode = "minimal"
network_access = "inherit"

[[verification.commands]]
name = "mkdocs-yaml-safeloader-property"
command = '''{python} -c "import json; from pathlib import Path; text = Path('mkdocs/theme.py').read_text(); assert 'yaml.load(f, SafeLoader)' in text; print('VERISEC_EVIDENCE: ' + json.dumps(dict(kind='property-check', rule_id='py-yaml-safe-loader', file_path='mkdocs/theme.py', check='unit test with object-construction payload', assertion='theme YAML parsing is constrained to SafeLoader'), sort_keys=True))"'''
timeout_seconds = 30
required = true
adapter = "custom"
description = "Check that mkdocs_theme.yml parsing is constrained to SafeLoader in the patched tree."
capabilities = ["regression-test", "property-check", "poc"]
