[review]
max_evidence_lines = 18
source_context_lines = 10
min_confidence = 0.35

[policy]
enabled = true
execution_profile = "trusted-local"
allowed_adapters = ["custom"]
allowed_executables = ["{python}"]
max_timeout_seconds = 120
max_output_bytes = 1000000
block_unavailable_adapters = false
warn_unavailable_adapters = true
environment_mode = "minimal"
network_access = "inherit"

[[verification.commands]]
name = "django-password-similarity-dos-property"
argv = [
  "{python}",
  "-c",
  '''
import json
from pathlib import Path

path = Path("django/contrib/auth/password_validation.py")
text = path.read_text(encoding="utf-8")
assert "def exceeds_maximum_length_ratio(password, max_similarity, value)" in text
assert "if max_similarity < 0.1" in text
assert "exceeds_maximum_length_ratio(password, self.max_similarity, value_part)" in text
assert "SequenceMatcher(a=password, b=value_part).quick_ratio()" in text
print(
    "VERISEC_EVIDENCE: "
    + json.dumps(
        dict(
            kind="property-check",
            rule_id="",
            file_path="django/contrib/auth/password_validation.py",
            check="algorithmic complexity regression test",
            assertion="Password similarity validation skips expensive SequenceMatcher calls for extreme length ratios.",
        ),
        sort_keys=True,
    )
)
''',
]
timeout_seconds = 30
required = true
adapter = "custom"
description = "Check that Django short-circuits expensive password similarity checks."
capabilities = ["regression-test", "property-check", "algorithmic-complexity"]
